# Fetal-BET segmentation (step 4).
#
# This env REPLACES the arfentul/fetalbet-model:first container. That image was
# a 6 GB linux/amd64 CUDA build; everything it actually needed for inference is
# below. Works on linux-64, osx-arm64 and win-64 alike.
#
# Device selection is runtime, not build-time: the inference script resolves
# cuda -> mps -> xpu -> cpu. On Linux with an NVIDIA GPU, conda pulls the CUDA
# build of pytorch automatically; on macOS it pulls the MPS-capable build.
name: haitch-fetalbet
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pytorch>=2.2
  - numpy<2
  - nibabel
  - scipy
  - tqdm
  - pip
  - pip:
      - monai==1.2.0
